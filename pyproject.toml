[project]
name = "auth_service"
version = "0.1.0"
description = "description"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    "fastapi>=0.115.0",
    "httpx>=0.27.0",
    "python-jose[cryptography]>=3.3.0",
    "pydantic-settings>=2.4.0",
    "pydantic[email]>=2.5.0,<2.9.0",
]

[project.optional-dependencies]
test = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "pytest-mock>=3.12.0",
    "pytest-cov>=4.0.0",
    "pytest-xdist>=3.3.0",
    "httpx>=0.27.0",
    "faker>=20.0.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
markers = [
    "unit: Unit tests (default)",
    "integration: Integration tests that require external services",
    "slow: Slow tests that should be run separately",
]
filterwarnings = [
    "ignore::DeprecationWarning:slowapi.extension",
    'ignore:.*"@coroutine" is deprecated.*:DeprecationWarning',
]
addopts = [
    "--strict-markers",
    "--tb=short",
    "--disable-warnings",
]

[tool.coverage.run]
source = ["src"]
omit = ["tests/*", "*/migrations/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if self.debug:",
    "if __name__ == .__main__.:",
    "raise AssertionError",
    "raise NotImplementedError",
    "if 0:",
    "if False:",
]
