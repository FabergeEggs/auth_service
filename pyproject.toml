[project]
name = "auth_service"
version = "0.1.0"
description = "description"
readme = "README.md"
requires-python = ">=3.11,<3.14"  # Ограничиваем сверху
dependencies = [
    "fastapi>=0.115.0",
    "httpx>=0.27.0",
    "python-jose[cryptography]>=3.3.0",
    "pydantic-settings>=2.4.0",
    "pydantic[email]>=2.5.0,<2.9.0",
]

[tool.pytest.ini_options]
markers = [
    "integration: integration tests",
    "slow: slow tests",
]
filterwarnings = [
    "ignore::DeprecationWarning:slowapi.extension",
]

[project.optional-dependencies]
test = [
    "pytest",
    "pytest-asyncio",
    "pytest-mock",
    "pytest-cov",
    "httpx",
    "faker",
]
