version: '3.8'

services:
  keycloak:
    image: quay.io/keycloak/keycloak:26.2.4
    container_name: keycloak
    ports:
      - "8082:8080"
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: myadmin
      KC_EMAIL_ENABLED: "true"
      KC_EMAIL_HOST: mailhog
      KC_EMAIL_PORT: 1025
      KC_EMAIL_FROM: noreply@myapp.local
      KC_EMAIL_FROM_DISPLAY_NAME: "My App Auth"
      KC_EMAIL_AUTH_ENABLED: "false"
      KC_EMAIL_SSL_ENABLED: "false"
      KC_EMAIL_STARTTLS_ENABLED: "false"
      KC_HEALTH_ENABLED: "true"
      KC_METRICS_ENABLED: "true"
      KC_LOG_LEVEL: DEBUG
    volumes:
      - ./keycloak-export:/opt/keycloak/data/import:ro 
      - keycloak_data:/opt/keycloak/data
    command: start-dev --import-realm
    depends_on:
      mailhog:
        condition: service_started
    networks:
      - auth-network
    healthcheck:
      test: ["CMD", "/opt/keycloak/bin/kc.sh", "show-config"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  mailhog:
    image: mailhog/mailhog:latest
    container_name: mailhog
    ports:
      - "1025:1025"
      - "8025:8025"
    volumes:
      - mailhog_data:/maildir
    networks:
      - auth-network

  auth-service:
    build: .
    container_name: auth-service
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      keycloak:
        condition: service_started
      mailhog:
        condition: service_started
    networks:
      - auth-network

  redis:
    image: redis:7-alpine
    container_name: redis
    ports:
      - "6379:6379"
    networks:
      - auth-network

networks:
  auth-network:
    driver: bridge
  
volumes:
  mailhog_data:
  keycloak_data:
